  --orange:#F2A866; --orange-soft:#3A2814; --good:#5CC48A; --good-soft:#18301F; --warn:#E3A64D; --warn-soft:#352813; --bad:#F07A6E; --bad-soft:#3A1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111D; --surface:#1C1929; --ink:#ECEAF6; --muted:#A39DBD; --line:#302B45; --th:#252136;
  --brand:#A99DEB; --brand-ink:#15121F; --brand-soft:#2A2445; --teal:#6CCAD6; --teal-soft:#183338;
  --orange:#F2A866; --orange-soft:#3A2814; --good:#5CC48A; --good-soft:#18301F; --warn:#E3A64D; --warn-soft:#352813; --bad:#F07A6E; --bad-soft:#3A1C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--brand)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.mark svg{width:40px;height:40px;flex:0 0 auto}
.mark b{font-family:var(--display);font-size:22px;color:var(--brand);font-weight:700;line-height:1.1;display:block}
.mark small{color:var(--muted);font-size:12px}
.demo{background:var(--orange-soft);color:var(--orange);border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:600}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px;max-width:1320px;margin:0 auto}
.shell.solo{grid-template-columns:minmax(0,1fr)}
nav.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
nav.rail a svg{width:18px;height:18px;flex:0 0 auto}
nav.rail a:hover{background:var(--th);color:var(--ink)}
nav.rail a[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
nav.rail .sep{font-size:11.5px;color:var(--muted);letter-spacing:.02em;padding:14px 12px 4px}
main{min-width:0}
footer.credit{text-align:center;color:var(--muted);font-size:13px;padding-block:8px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer.credit b{color:var(--brand)}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:72ch}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.list th,.list td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.list th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--good-soft);color:var(--good)}.p-wait{background:var(--warn-soft);color:var(--warn)}.p-no{background:var(--th);color:var(--muted)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--teal-soft);color:var(--teal)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
select,input[type=text],input[type=number],input[type=date],input:not([type]){border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
.toast .undo{background:none;border:0;color:var(--orange);font-weight:700;cursor:pointer;text-decoration:underline}
.qadd{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.qadd input:not([type]),.qadd input[type=text]{flex:1 1 180px}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.meter{display:flex;align-items:center;gap:12px}
.mbar{flex:1;height:10px;background:var(--th);border-radius:99px;overflow:hidden;min-width:60px}.mbar>span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .6s ease}
.hint{background:var(--brand-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px}
.hint.ok{background:var(--good-soft)}.hint.warn{background:var(--warn-soft)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* stats */
.stat .k{color:var(--muted);font-size:13px}.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.stat .s{font-size:12.5px;color:var(--muted)}
.ring{display:grid;justify-items:center;text-align:center}
.ring svg{width:100%;max-width:150px}.ring .k{font-weight:600}.ring .s{font-size:12.5px;color:var(--muted)}
/* levels & course cards */
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.levels button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:600;display:grid;line-height:1.3;text-align:center}
.levels button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.levels button[aria-selected=true]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.levels button[aria-selected=true] small{color:inherit;opacity:.85}
.lvhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.lvhead .lvb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{position:relative;display:grid;gap:6px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;cursor:pointer;text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--lc,var(--brand))}
.ccard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(40,30,90,.10)}
.ccard.off{opacity:.62}
.ccard .cc{font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.ccard b{font-size:15px;line-height:1.45}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.mini{width:34px;height:34px}
/* sections grid */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.scard{text-decoration:none;color:inherit;display:grid;gap:4px;text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.scard:hover{border-color:var(--brand)}
.scard.mine{border-color:var(--teal);background:var(--teal-soft)}
.scard .sn{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;flex:0 0 auto}
.fac{display:flex;align-items:center;gap:8px}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step .n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--th);font-weight:700}
.step.done .n{background:var(--good);color:#fff}
.step .b{min-width:0;flex:1}.step h3{margin:2px 0;font-size:15.5px}.step p{margin:0 0 8px}
label.btn{display:inline-flex}
.alert{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.alert.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,15,40,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.modal .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;font-size:26px}
.modal h2{margin:0 0 6px}
/* login */
.login{max-width:760px;margin:10px auto;display:grid;gap:16px}
.hero{background:var(--brand);color:#fff;border-radius:20px;padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;overflow:hidden;position:relative}
.hero svg.big{width:92px;height:92px;flex:0 0 auto}
.hero h1{font-family:var(--display);font-size:34px;margin:0;color:#fff}
.hero p{margin:4px 0 0;opacity:.9}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{display:grid;gap:4px;text-align:right;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.role:hover,.role[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
.role b{font-size:16px}
.facpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.facpick button{display:flex;align-items:center;gap:10px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.facpick button:hover{border-color:var(--brand)}
.facpick small{display:block;color:var(--muted);font-size:12px}
/* matrix */
.matrix td,.matrix th{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.matrix th{background:var(--th);font-size:12.5px}
.matrix td.n{text-align:right}
.lv{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lv.l1{background:color-mix(in srgb,var(--brand) 16%,var(--surface))}.lv.l2{background:color-mix(in srgb,var(--brand) 42%,var(--surface))}.lv.l3{background:var(--brand);color:var(--brand-ink)}
.mx .cell{cursor:pointer;width:30px}.mx .cell:hover{outline:2px solid var(--orange)}
/* charts */
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:76px minmax(0,1fr) 54px;align-items:center;gap:10px}
.track{position:relative;height:14px;background:var(--th);border-radius:5px;overflow:hidden}
.fill{position:absolute;inset-block:0;right:0;border-radius:5px;background:var(--brand)}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tasks input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--brand);flex:0 0 auto}
.tasks label{flex:1;min-width:0;display:grid;cursor:pointer}
.tasks .tm{font-size:12.5px;color:var(--muted)}
.tasks li.done .tt{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.late{color:var(--bad);font-weight:600}
.flow{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.fnode{flex:0 0 auto;display:grid;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:120px;text-align:center}
.fnode span{font-size:12px;color:var(--muted)}.fnode:hover{border-color:var(--brand);background:var(--brand-soft)}
.farrow{color:var(--muted);font-size:18px;flex:0 0 auto}
.stdcard{display:grid;gap:4px;text-align:right;cursor:pointer}
.stdcard.on{border-color:var(--brand);background:var(--brand-soft)}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chg-new{background:var(--good-soft)}.chg-mod{background:var(--warn-soft)}.chg-err{background:var(--bad-soft)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ed{min-height:1.5em;outline:none}
.ed[contenteditable=true]{background:#FFF7E0;border-bottom:1px dashed #C9A23A;border-radius:3px;padding:1px 4px}
.ed[contenteditable=true]:focus{background:#FFEFC2}
.ed[contenteditable=true]:empty::before{content:"اضغط للكتابة";color:#B69B5A;font-size:.9em}

/* ===== official template sheet (fixed paper colours) ===== */
.doc{--P:#4C3D8E;--L:#9498CB;--T:#52B5C2;--B:#5279BB;--O:#F59F52;--G1:#F2F2F2;--G2:#D9D9D9;--TX:#262626;
  background:#fff;color:var(--TX);font-family:var(--docfont);font-size:17px;line-height:1.55;border:1px solid #d8d6e3;border-radius:4px;box-shadow:0 4px 18px rgba(30,20,70,.08);max-width:980px;padding:0 0 28px;overflow:hidden;color-scheme:light}
.doc .cover{background:var(--P);color:#fff;padding:22px clamp(16px,4vw,40px) 20px;position:relative}
.doc .cover .tag{position:absolute;top:0;left:clamp(16px,4vw,40px);background:var(--T);color:#fff;font-family:var(--font);font-size:12px;font-weight:700;padding:6px 10px 10px;border-radius:0 0 6px 6px}
.doc .cover h1{color:#fff;font-size:30px;margin:14px 0 2px;font-family:var(--docfont);font-weight:700}
.doc .cover .sub{color:var(--O);font-size:18px}
.doc .pad{padding:0 clamp(16px,4vw,40px)}
.doc .info{width:100%;border-collapse:separate;border-spacing:4px;margin-top:18px;border:1.5px solid var(--P)}
.doc .info td{border:1px solid var(--P);padding:6px 10px;vertical-align:middle}
.doc .info .lb{color:var(--B)}
.doc .info .vl{color:var(--T);font-size:19px}
.doc h2.s{color:var(--P);font-size:23px;font-weight:700;margin:26px 0 4px;font-family:var(--docfont)}
.doc h3.s{color:var(--T);font-size:19px;font-weight:700;margin:12px 0 6px;font-family:var(--docfont)}
.doc .hint2{font-size:14px;color:#6b6b6b;margin:0 0 6px}
.doc table.t{width:100%;border-collapse:separate;border-spacing:3px;font-size:15.5px}
.doc table.t th{background:var(--P);color:#fff;font-weight:700;padding:6px 7px;text-align:center;vertical-align:middle}
.doc table.t th.l{background:var(--L)}
.doc table.t td{background:var(--G1);padding:5px 8px;vertical-align:top;text-align:right}
.doc table.t tr:nth-child(even) td{background:var(--G2)}
.doc table.t td.c{text-align:center}
.doc table.t td.code{background:var(--L)!important;color:#fff;text-align:center;font-weight:700;width:3.2em}
.doc table.t tr.dom td{background:var(--T)!important;color:#fff;font-weight:700}
.doc table.t td.lbl{background:var(--P)!important;color:#fff;font-weight:700;text-align:center;white-space:nowrap}
.doc .box{border:1.5px solid #222;padding:8px 12px;min-height:3.2em}
.doc .foot{font-size:14px;color:#444;margin-top:6px}
.doc .chart{max-width:560px;margin:6px 0}
.doc .ed[contenteditable=true]{background:#FFF7E0}
.doc.final .ed[contenteditable=true]{background:none;border:0;padding:0}
.doc.final .ed:empty::before{content:""}
.doc.final .chart,.doc.final .noexport{display:none}
.doc .num{font-variant-numeric:tabular-nums}
/* exam cover */
.exam{font-family:var(--font);font-size:14px;color:#1d1d1d;background:#fff;border:1px solid #d8d6e3;border-radius:4px;max-width:900px;padding:18px clamp(12px,3vw,28px);color-scheme:light}
.exam .eh{text-align:center;font-weight:700;font-size:16px;border-bottom:3px solid #4C3D8E;padding-bottom:8px;margin-bottom:12px}
.exam table{width:100%;border-collapse:collapse;margin-bottom:12px}
.exam td,.exam th{border:1.5px solid #555;padding:5px 7px;text-align:center;vertical-align:middle}
.exam th,.exam td.h{background:#E8E8E8;font-weight:700}
.exam .cap{background:#D6D6D6;font-weight:700}
.exam .q{min-width:3em}
.exam .ed[contenteditable=true]{display:block}
.exam.final .ed[contenteditable=true]{background:none;border:0}
.exam.final .ed:empty::before{content:""}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rail a{white-space:nowrap}
  nav.rail .sep{display:none}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3,.roles{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* guide mascot */
.guide{position:relative;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF4E6,#F1EEFB);border:1.5px solid #F7C99A;border-radius:20px;padding:10px 16px 10px 40px;margin:0 0 14px}
.guide .masc{width:86px;height:86px;flex:none;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.guide .masc.wow{animation:shake .45s ease-in-out infinite}
.guide .masc.wow .eye{animation:pop 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.guide .masc.wow .paper{animation:fly 1.6s ease-in-out infinite}
.guide .masc.sleep{animation:bob 4s ease-in-out infinite}
.guide .bubble{flex:1;min-width:0}.guide .bubble b{display:block;font-size:16.5px;color:var(--brand,#4C3D8E);margin-bottom:2px}.guide .bubble p{margin:0 0 8px;font-size:14px;line-height:1.6}
.guide .gx{position:absolute;top:6px;left:8px;border:0;background:none;font-size:20px;color:#8A8399;cursor:pointer;line-height:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes pop{0%,60%,100%{transform:scale(1)}75%{transform:scale(1.35)}}
@keyframes fly{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.step.now{border:2px solid #F59F52;box-shadow:0 0 0 4px #FDEBD7}
.step.now .n{background:#F59F52;color:#fff;animation:bob 1.8s ease-in-out infinite}
.step.now h3::after{content:"أنتِ هنا";font-size:11.5px;font-weight:700;background:#FDEBD7;color:#B5601A;border-radius:99px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle}

function draftGrades(a){

  t+=`حصل ${pct(top,0)} من الطلاب على تقدير ب+ فأعلى، مقابل ${pct(weak,0)} في التقديرات د+ وما دونها. `;

 ${["1","2","3"].map(d=>{const r=a.clo.filter(o=>o.c[0]===d);return `<tr class="dom"><td class="c">${d}</td><td colspan="6">${DOMAINS[CLO_DOM[d]]}</td></tr>`+(r.length?r.map(o=>`<tr><td class="code">${o.c}</td><td>${esc(o.t)}</td><td class="c">${o.plo}</td><td>${esc(o.m)}</td><td class="c num">${pct(o.tgt??TG(a.id).target,0)}</td><td class="c num" style="${o.ok?"":"color:#C0504D;font-weight:700"}">${pct(o.p)}</td><td>${ED("clo_"+o.c,M["clo_"+o.c])}</td></tr>`).join(""):`<tr><td class="code"></td><td colspan="6"></td></tr>`)}).join("")}</table></div><p class="foot noexport">المستوى الفعلي = نسبة الطلاب المنتظمين الذين حصلوا على ${pct(TG(a.id).scoreT,0)} فأكثر من مجموع درجات الناتج في أدوات التقييم كلها. يتحقق الناتج إذا بلغت ${pct(S().target,0)}.</p>`}

const SSR=[{"n": "إدارة البرنامج وضمان جودته", "subs": [["1-1", "إدارة البرنامج"], ["1-2", "ضمان جودة البرنامج"]], "crit": [["1-1-1", "تتسق رسالة البرنامج وأهدافه مع رسالة المؤسسة/الكلية وتوجه جميع عملياته وأنشطته", false], ["1-1-2", "يتوفر لدى البرنامج العدد الكافي من الكوادر المؤهلة للقيام بالمهام الأكاديمية والإدارية والمهنية والفنية، ولهم مهام وصلاحيات محددة.", true], ["1-1-3", "يتوفر للبرنامج مناخ تنظيمي وبيئة أكاديمية داعمة", false], ["1-1-4", "يُتابع القائمون على البرنامج مدى تحقق أهدافه من خلال مؤشرات أداء محددة، وتُتخذ الإجراءات اللازمة للتحسين", false], ["1-1-5", "تطبق إدارة البرنامج آليات تضمن النزاهة والعدالة والمساواة في جميع ممارساتها الأكاديمية والإدارية، وبين شطري الطلاب والطالبات والفروع (إن وجدت).", false], ["1-1-6", "تستفيد إدارة البرنامج من أراء المهنيين والخبراء في تخصص البرنامج في تقييم وتطوير وتحسين أدائه.", false], ["1-1-7", "تتيح إدارة البرنامج معلومات موثوقة ومعلنة عن البرنامج، وأدائه وإنجازاته بما يتناسب مع احتياجات المستفيدين.", false], ["1-1-8", "تلتزم إدارة البرنامج بتفعيل قيم الأمانة العلمية وحقوق الملكية الفكرية وقواعد الممارسات الأخلاقية والسلوك القويم في جميع المجالات والأنشطة الأكاديمية والبحثية والإدارية والخدمية.", true], ["1-1-9", "تطبق إدارة البرنامج الأنظمة واللوائح والإجراءات المعتمدة من قبل المؤسسة / الكلية، بما في ذلك التظلم، والشكاوى، والقضايا التأديبية.", false], ["1-2-1", "تطبق إدارة البرنامج نظاماً فاعلاً لضمان الجودة وإدارتها، يتسق مع نظام الجودة المؤسسي.", false], ["1-2-2", "يقوم البرنامج بتحليل مؤشرات الأداء الرئيسة وبيانات التقويم سنوياً ويستفاد منها في عمليات التخطيط والتطوير واتخاذ القرارات.", true], ["1-2-3", "يُجري البرنامج تقويماً دورياً شاملاً ويضع خططاً للتحسين، ويتابع تنفيذها.", false]]}, {"n": "التعليم والتعلم", "subs": [["2-1", "نواتج التعلم"]], "crit": [["2-1-1", "يحدد البرنامج نواتج التعلم المستهدفة وفق المعايير الأكاديمية التخصصية وبما يتسق مع رسالته ويتواءم مع خصائص الخريجين على المستوى المؤسسي، ويتم اعتمادها وإعلانها، وتراجع دورياً.", false], ["2-1-2", "تتوافق نواتج التعلم مع متطلبات الإطار الوطني للم const evAvail=k=>{const offs=Object.keys(DB.offer);return {annual:1,matrix:1,plover:1,faculty:DB.faculty.length,reports:offs.filter(id=>!isFE(id)).length,fe:offs.filter(isFE).length,files:offs.length,survey:allSections().length,dist:offs.length,cvs:DB.faculty.filter(f=>f.cv).length}[k]};
function evList(){
  const L=[];EVAUTO.forEach(([cr,n,k])=>{if(evAvail(k))L.push({cr,n,k,auto:1})});
  (DB.evid||[]).forEach(e=>L.push({cr:e.cr,n:e.n,file:e.file,eid:e.id}));
  const cnt={};return L.sort((a,b)=>a.cr.localeCompare(b.cr,undefined,{numeric:true})).map(e=>{cnt[e.cr]=(cnt[e.cr]||0)+1;return {...e,code:e.cr+"-"+String(cnt[e.cr]).padStart(2,"0")}});

const critOf=cr=>{for(const s of SSR)for(const c of s.crit)if(c[0]===cr)return {s,c};return null};
async function evFiles(e,ctx){
  // returns [[relativeName, blob]]
  const out=[],offs=Object.keys(DB.offer);const keepF=REPFINAL;REPFINAL=true;

    case "files":for(const id of offs){const c=CAT[id],P=await courseParts(id,ctx);const base=safe(`ملف المقرر ${c.code} ${c.name}`)+"/";P.forEach(p=>{if(p.path)out.push([base+p.path,p.blob])});out.push([base+"00 فهرس ملف المقرر.xlsx",xlsxBlob([["الفهرس",[["البند","الحالة","المسار"],...P.map(p=>[p.item,p.path?"متوفر":"ناقص",p.path||p.note||""])],[50,10,60]]])])}break;
    case "survey":out.push(["نتائج استبيانات تقييم المقررات.xlsx",xlsxBlob([["الاستبيانات",[["المقرر","الرمز","الشعبة","المستجيبون","متوسط التقييم (من 5)"],...allSections().map(s=>{const a=analyze(s.id,s.no);return [CAT[s.id].name,CAT[s.id].code,s.no,a.survey.n,+f2(a.overall)]})],[40,12,8,12,16]]])]);break;
    case "dist":out.push(["توزيع الدرجات على النواتج لكل المقررات.xlsx",xlsxBlob(offs.slice(0,60).map(id=>{const sp=specOf(id),cm=compsOf(id);return [CAT[id].code,[[CAT[id].name],["أداة التقييم","الدرجة",...sp.clos.map(x=>x.c)],...cm.map((c,j)=>[c.n,c.m,...sp.clos.map((x,i)=>+sp.map[j][i]||0)])]]}))]);
      {const fc=COVFINAL;COVFINAL=true;for(const id of offs.filter(id=>!isFE(id)))for(const s of DB.offer[id].sections)for(const [k,n] of [["mid","النصفي"],["fin","النهائي"]])out.push([`أغلفة الاختبارات/${safe(CAT[id].code)} شعبة ${s.no} ${n}.html`,standalone("غلاف",articleOf(vCover(id,s.no,k)))]);COVFINAL=fc}break;
    case "faculty":out.push(["أعضاء هيئة التدريس وإسناد الشعب.xlsx",xlsxBlob([["الأعضاء",[["الاسم","الرتبة","عدد الشعب","الشعب","تنسيق"],...DB.faculty.map(f=>{const ss=allSections().filter(s=>s.fac===f.id);return [f.name,f.rank,ss.length,ss.map(s=>CAT[s.id].code+"/"+s.no).join("، "),Object.entries(DB.offer).filter(([,o])=>o.coord===f.id).map(([id])=>CAT[id].code).join("، ")]})],[28,16,10,50,24]]])]);break;
    case "cvs":for(const f of DB.faculty.filter(f=>f.cv)){const b=await FS.get("cv|"+f.id);if(b)out.push([safe(f.name)+extOf(f.cv),b])}break;
    default:if(e.eid){const b=await FS.get(TERMK()+"|evid|"+e.eid);if(b)out.push([safe(e.n)+extOf(e.file),b])}

}
async function exportEvidence(tk){
  const dl=await getDL();if(!dl)return;
  toast("الحقيبة تفهرس الأدلة… قد يأخذ ذلك دقيقة");
  try{
    await withTerm(tk,async()=>{
      const zip=new JSZip(),root=safe(`أدلة البرنامج - ${S().program} - ${termLabel(S())}`)+"/",ctx={dx:{}},rows=[],L=evList();
      for(const e of L){
        const k=critOf(e.cr),sn=SSR.indexOf(k?.s)+1,sdir=safe(`المعيار ${sn} - ${k?.s.n||""}`)+"/",cdir=sdir+e.cr+"/";
        const files=await evFiles(e,ctx);
        if(!files.length){rows.push([e.code,e.n,"المعيار "+sn,e.cr,e.auto?"تلقائي":"مرفوع",0,"ناقص",""]);continue}
        let rel;
        if(files.length===1&&!files[0][0].includes("/")){rel=cdir+safe(e.code+" "+e.n)+extOf(files[0][0]);zip.file(root+rel,files[0][1])}
        else{rel=cdir+safe(e.code+" "+e.n)+"/";files.forEach(([n,b])=>zip.file(root+rel+n,b))}
        rows.push([e.code,e.n,"المعيار "+sn,e.cr,e.auto?"تلقائي":"مرفوع",files.length,"متوفر",rel]);
      }
      indexFiles(zip,root,"فهرس الأدلة",["رمز الدليل","اسم الدليل","المعيار","المحك","المصدر","عدد الملفات","الحالة","المسار"],rows);
      const gaps=SSR.flatMap((s,i)=>s.crit.filter(c=>!L.some(e=>e.cr===c[0])).map(c=>[`المعيار ${i+1}`,c[0],c[1]]));
      zip.file(root+"00 محكات بلا أدلة بعد.xlsx",xlsxBlob([["بلا أدلة",[["المعيار","المحك","نص المحك"],...gaps],[12,10,90]]]));
      const blob=await zip.generateAsync({type:"blob"});
      await dl.save({filename:root.slice(0,-1)+".zip",data:blob});
      confetti();toast(`نُزّلت ${rows.length} أدلة مفهرسة · ${gaps.length} محكاً بلا دليل بعد`);
    });
  }catch(e){toast(e?.code==="declined"?"أُلغي التنزيل":"تعذر تجهيز الأدلة: "+(e?.message||e))}
}

function parseHash(){const h=(location.hash||"").slice(1);let m;
  if((m=h.match(/^course-([A-Za-z0-9]+)$/)))return {v:"course",id:m[1]};
  if((m=h.match(/^course-([A-Za-z0-9]+)-(secs|clo|ver|file|team)$/))){CTAB=m[2];return {v:"course",id:m[1]}}
  if((m=h.match(/^join-([A-Za-z0-9]+)$/)))return {v:"join",id:m[1]};
  if((m=h.match(/^s-([A-Za-z0-9]+)$/)))return {v:"spub",id:m[1]};
  if((m=h.match(/^survey-([A-Za-z0-9]+)$/)))return {v:"survey",id:m[1]};
  if((m=h.match(/^fill-([A-Za-z0-9]+)$/)))return {v:"fill",id:m[1]};
  if((m=h.match(/^sec-([A-Za-z0-9]+)-(\d+)$/)))return {v:"sec",id:m[1],no:m[2]};
  if((m=h.match(/^rep-([A-Za-z0-9]+)-(\d+)$/)))return {v:"rep",id:m[1],no:m[2]};
  if((m=h.match(/^cover-([A-Za-z0-9]+)-(\d+)-(mid|fin)$/)))return {v:"cover",id:m[1],no:m[2],kind:m[3]};
  if((m=h.match(/^int-([A-Za-z0-9]+)$/)))return {v:"int",id:m[1]};
  return {v:h||"home"};
}

  if(mode==="gray"){for(let i=0;i<d.length;i+=4){const v=d[i]*.3+d[i+1]*.59+d[i+2]*.11;d[i]=d[i+1]=d[i+2]=v}x.putImageData(im,0,0);return c}
  const sm=document.createElement("canvas");sm.width=Math.max(8,W>>4);sm.height=Math.max(8,H>>4);const sx=sm.getContext("2d");sx.filter="blur(2px)";sx.drawImage(c,0,0,sm.width,sm.height);
  const bg=document.createElement("canvas");bg.width=W;bg.height=H;const bx=bg.getContext("2d");bx.imageSmoothingEnabled=true;bx.drawImage(sm,0,0,W,H);const b=bx.getImageData(0,0,W,H).data;
  for(let i=0;i<d.length;i+=4){const v=d[i]*.3+d[i+1]*.59+d[i+2]*.11,bv=Math.max(40,b[i]*.3+b[i+1]*.59+b[i+2]*.11);let n=Math.min(1,v/bv);n=n>.9?1:Math.pow(n,2.2);const o=n*255;d[i]=d[i+1]=d[i+2]=o}
  x.putImageData(im,0,0);return c;
}
function renderPage(p,maxW){const c=filterPage(basePage(p,maxW),p.filter),x=c.getContext("2d");x.fillStyle="#000";p.boxes.forEach(b=>x.fillRect(b[0]*c.width,b[1]*c.height,b[2]*c.width,b[3]*c.height));return c}
function scDraw(tmp){
  if(!SC)return;const has=SC.pages.length,p=cp(),c=$("#scc");$("#sce").hidden=!!has;c.hidden=!has;$("#scedit").hidden=!has;$("#scsave").disabled=!has;

}
let TESS=null;
async function ocrWorker(){if(TESS)return TESS;await loadLib("tess");TESS=await Tesseract.createWorker(["ara","eng"]);return TESS}
const LABEL_RE=/(اسم\s*ال?طالب|اسم\s*ال?طالبة|الاسم|student\s*name|name|الرقم\s*الجامعي|رقم\s*ال?طالب|الرقم\s*الأكاديمي|student\s*id|university\s*id|\bid\b|السجل\s*المدني|رقم\s*الهوية)/i;
const ID_RE=/[0-9٠-٩]{7,12}/;
const NEG_RE=/(المقرر|course|instructor|أستاذ|المراجع|reviewer|coordinator|منسق|البرنامج|program|الكلية|college)/i;
async function redactPage(p,loud){
  const base=filterPage(basePage(p,1600),p.filter==="orig"?"gray":p.filter);
  try{if(loud)toast("أبحث عن الاسم والرقم الجامعي… (أول مرة تحتاج اتصالاً)");const w=await ocrWorker();const {data}=await w.recognize(base);
    const W=base.width,H=base.height,boxes=[];
    (data.lines||[]).forEach(l=>{if(LABEL_RE.test(l.text)&&!NEG_RE.test(l.text)){const hh=l.bbox.y1-l.bbox.y0,pad=hh*.7;boxes.push([0,Math.max(0,(l.bbox.y0-pad)/H),1,Math.min(1,(hh+pad*2)/H)])}});
    (data.words||[]).forEach(wd=>{if(ID_RE.test(wd.text)){const b=wd.bbox,px=(b.x1-b.x0)*.15,py=(b.y1-b.y0)*.4;boxes.push([Math.max(0,(b.x0-px)/W),Math.max(0,(b.y0-py)/H),(b.x1-b.x0+px*2)/W,(b.y1-b.y0+py*2)/H])}});
    p.boxes.push(...boxes);p.red=true;if(loud)toast(boxes.length?`أُخفي ${boxes.length} موضعاً. راجعي الصفحة، وارسمي مربعاً على أي شيء فات.`:"لم أجد اسماً أو رقماً جامعياً مطبوعاً. ارسمي مربعاً على الخانة يدوياً إن وُجدت.");return boxes.length}
  catch(e){if(loud)toast("تعذر التعرف التلقائي الآن (يحتاج اتصالاً بالإنترنت أول مرة). ارسمي مربعاً على الاسم والرقم يدوياً.");return 0}
}

function bannerRows(pages){ // pages: [[{s,x,y,w}]]

const DOMC={"1":"ع","2":"م","3":"ق"};
function specChecks(id){
  const sp=specOf(id),cm=compsOf(id),prow=CAT[id]?.m||[],pc=PLOS.map(p=>p.c),E=[],W=[];
  const seen={};sp.clos.forEach(o=>{if(seen[o.c])E.push(`رمز الناتج ${o.c} مكرر`);seen[o.c]=1});
  const tx={};sp.clos.forEach(o=>{const k=(o.t||"").trim();if(k&&tx[k])W.push(`الناتجان ${tx[k]} و${o.c} بالنص نفسه`);tx[k]=o.c});
  sp.clos.forEach(o=>{
    if(!/^[1-3]\.[1-9]$/.test(o.c))E.push(`رمز الناتج «${o.c}» غير صحيح؛ يُكتب مثل 1.1 أو 2.3`);
    if(!o.plo){E.push(`الناتج ${o.c} غير مربوط بأي ناتج من نواتج البرنامج`);return}
    const j=pc.indexOf(o.plo);
    if(j<0)E.push(`الناتج ${o.c} مربوط برمز «${o.plo}» وهو ليس من نواتج البرنامج`);
    else if(!prow[j])E.push(`يتعارض مع توصيف البرنامج: الناتج ${o.c} مربوط بـ ${o.plo}، ومصفوفة توصيف البرنامج (TP-151) لا تربط هذا المقرر بـ ${o.plo}`);
    if(DOMC[o.c[0]]&&o.plo[0]!==DOMC[o.c[0]])W.push(`الناتج ${o.c} في مجال «${DOMAINS[CLO_DOM[o.c[0]]]}» لكنه مربوط بـ ${o.plo} من مجال آخر`);
    if(!(o.t||"").trim())E.push(`الناتج ${o.c} بلا نص`);
  });
  pc.forEach((p,j)=>{if(prow[j]&&!sp.clos.some(o=>o.plo===p))W.push(`توصيف البرنامج يربط المقرر بـ ${p} (${LEVELS[prow[j]]}) ولا يوجد ناتج في توصيف المقرر يقيسه`)});

  const X=specX(id),hrs=(X?.topics||[]).reduce((a,t)=>a+(+t[1]||0),0),cr=CAT[id]?.cr;
  if(cr&&hrs&&(hrs<cr*13||hrs>cr*19))W.push(`مجموع ساعات الموضوعات ${hrs} لا يناسب ${cr} ساعات معتمدة (المتوقع نحو ${cr*15}، ${cr*17})`);
  if(!X?.topics?.length)W.push("لم تُضف موضوعات المقرر بعد؛ أوزان المصفوفة تُحسب منها");
  const M=[];cm.forEach((c,j)=>{const s=(sp.map[j]||[]).reduce((a,b)=>a+(+b||0),0);if(s!==c.m)M.push(`مصفوفة القياس: مجموع «${c.n}» ${s} لا يساوي درجته ${c.m}`)});
  sp.clos.forEach((o,i)=>{if(!sp.map.some(r=>+r[i]))M.push(`مصفوفة القياس: الناتج ${o.c} لا يأخذ أي درجة`)});

}

function bindSpecEdit(R){

  const warnPlo=(code,p)=>{const j=pc.indexOf(p);if(p&&(j<0||!prow[j]))modal("⚠️","var(--bad-soft)","يتعارض مع توصيف البرنامج",`ربطتِ الناتج ${esc(code)} بـ ${esc(p)}، ومصفوفة توصيف البرنامج (TP-151) لا تربط مقرر ${esc(CAT[id].name)} بـ ${esc(p)}. اختاري ناتجاً يربطه توصيف البرنامج بالمقرر (${pc.filter((_,k)=>prow[k]).join("، ")})، أو اطلبي تعديل توصيف البرنامج.`,"فهمت")};
  on("[data-ce]","change",(e,el)=>{const [i,f]=el.dataset.ce.split("|"),s=spEdit(id),o=s.clos[+i],v=el.value.trim();

    o[f]=v;if(f==="c")s.clos.sort((a,b)=>a.c.localeCompare(b.c,undefined,{numeric:true}));
    spCommit(id,f==="t"||f==="m");if(f==="plo")warnPlo(o.c,v);else toast("حُفظ التعديل")});
  on("[data-cdel]","click",(e,b)=>{const s=spEdit(id),i=+b.dataset.cdel;if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="تأكيد";setTimeout(()=>{if(b.isConnected){b.dataset.arm="";b.textContent="حذف"}},3000);return}s.clos.splice(i,1);spCommit(id);toast("حُذف الناتج وأُعيد توزيع الدرجات")});
  const ca=$("#cadd");if(ca)ca.onsubmit=e=>{e.preventDefault();const s=spEdit(id),d=$("#cadd-d").value,n=s.clos.filter(x=>x.c[0]===d).length+1,code=d+"."+n,p=$("#cadd-p").value;
    s.clos.push({c:code,t:$("#cadd-t").value.trim(),plo:p,m:{"1":"الامتحانات (اختبار قصير، امتحان نصفي ونهائي)","2":"الامتحانات، تقييم المشاريع والواجبات (روبرك)","3":"تقييم المشاريع والواجبات (روبرك)"}[d]});
    s.clos.sort((a,b)=>a.c.localeCompare(b.c,undefined,{numeric:true}));spCommit(id);if(p)warnPlo(code,p);if(!p)toast(`أُضيف الناتج ${code}؛ اربطيه بناتج البرنامج`)};
  on("[data-ae]","change",(e,el)=>{const [j,f]=el.dataset.ae.split("|"),s=spEdit(id),c=s.comps[+j];if(f==="m")c.m=Math.max(0,Math.min(100,+el.value||0));else{c.n=el.value.trim()||c.n}
    spCommit(id);const t=s.comps.reduce((a,x)=>a+x.m,0);if(t!==100)toast(`مجموع النسب الآن ${t}% وليس 100%`);else toast("حُفظ، وأُعيد توزيع درجات الأداة على النواتج")});
  on("[data-adel]","click",(e,b)=>{const s=spEdit(id);s.comps.splice(+b.dataset.adel,1);spCommit(id);toast("حُذفت الأداة")});
  const aa=$("#aadd");if(aa)aa.onsubmit=e=>{e.preventDefault();const s=spEdit(id),n=$("#aadd-n").value.trim(),m=+$("#aadd-m").value||0,used=new Set(s.comps.map(c=>c.k));
    let k=/نصف|فصلي|Mid/i.test(n)&&!used.has("mid")?"mid":/نهائ|Final/i.test(n)&&!used.has("fin")?"fin":"";if(!k){let i=1;while(used.has("oth"+i))i++;k="oth"+i}
    s.comps.push({n,m,k});spCommit(id);const t=s.comps.reduce((a,x)=>a+x.m,0);toast(t===100?"أُضيفت الأداة":`أُضيفت الأداة؛ المجموع الآن ${t}%`)};
}

LIBS.supabase="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
const SB_SPLIT=["offer","sec","rep","uploads","exam","files","specs","specx","specv","chat","resp","cext","ucol","sig","mxtc","elec","road","facKey","pdocs","ctg"];
function sbCfg(){let c={};try{c=JSON.parse(localStorage.getItem("haqiba-sb")||"{}")||{}}catch(e){}const H=window.HAQIBA_CONFIG||{};return {url:H.supabaseUrl||c.url||"",key:H.supabaseKey||c.key||"",domain:H.emailDomain||c.domain||"",fixed:!!(H.supabaseUrl&&H.supabaseKey)}}
let SB=null,SBUSER=null,SBST="off",SBLAST=null,SBH={},SBT=null,SBERR="",SBBUSY=false,SBFIRST=true;
try{SBH=JSON.parse(localStorage.getItem("haqiba-sbh")||"{}")||{};SBLAST=localStorage.getItem("haqiba-sblast")||null}catch(e){}
const sbOn=()=>!!(SB&&SBUSER);
const jh=v=>String(hash(JSON.stringify(v??null)));
function sbRows(db){const R={};Object.entries(db).forEach(([k,v])=>{if(SB_SPLIT.includes(k)&&v&&typeof v==="object"&&!Array.isArray(v))Object.entries(v).forEach(([s,x])=>R[k+"/"+s]=x);else R[k]=v});return R}
function sbApply(rows,full){
  if(full){const keep={};SB_SPLIT.forEach(k=>keep[k]={});rows.forEach(r=>{const i=r.k.indexOf("/");if(i<0){if(r.v!==null)keep[r.k]=r.v}else{const f=r.k.slice(0,i);if(r.v!==null)(keep[f]=keep[f]||{})[r.k.slice(i+1)]=r.v}});DB=keep;SBH={}}
  else rows.forEach(r=>{const i=r.k.indexOf("/"),local=sbRows(DB);if(local[r.k]!==undefined&&jh(local[r.k])!==SBH[r.k]&&SBH[r.k]!==undefined)return; /* local unsynced edit wins, pushed next */
    if(i<0){if(r.v===null)delete DB[r.k];else DB[r.k]=r.v}else{const f=r.k.slice(0,i),s=r.k.slice(i+1);DB[f]=DB[f]||{};if(r.v===null)delete DB[f][s];else DB[f][s]=r.v}});
  rows.forEach(r=>SBH[r.k]=jh(r.v));
  if(DB.v!==3)DB.v=3;migrateV4();try{applyProg()}catch(x){}
  if(ME&&ME.role==="fac"&&!FAC(ME.fac))ME=null;
  if(DB.matrix)DB.matrix.forEach((m,i)=>{if(MATRIX[i])MATRIX[i].m=m});
  Object.keys(SPEC_CACHE).forEach(k=>delete SPEC_CACHE[k]);Object.keys(GEN).forEach(k=>delete GEN[k]);MEMO.clear();
  BUSY=false;try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));localStorage.setItem("haqiba-sbh",JSON.stringify(SBH))}catch(e){}
}
async function sbPull(full){
  if(!sbOn()||SBBUSY)return;SBBUSY=true;
  try{
    let q=SB.from("haqiba_rows").select("k,v,updated_at").order("updated_at",{ascending:true}).limit(5000);
    if(!full&&SBLAST)q=q.gt("updated_at",SBLAST);
    const {data,error}=await q;if(error)throw error;
    if(full&&!data.length){SBBUSY=false;SBST="ok";await sbPush(true);toast("أُنشئت قاعدة البيانات من بيانات هذا الجهاز");return}
    if(data.length){sbApply(data,full);SBLAST=data[data.length-1].updated_at;try{localStorage.setItem("haqiba-sblast",SBLAST)}catch(e){}}
    await sbPullResponses();
    SBST="ok";SBERR="";
    if(data.length&&!document.activeElement?.closest?.("input,textarea,select,[contenteditable=true]"))render();
  }catch(e){SBST="err";SBERR=e.message||String(e)}finally{SBBUSY=false;sbBadge()}
}
async function sbPush(all){
  if(!sbOn())return;const R=sbRows(DB),up=[],now=new Date().toISOString(),who=SBUSER.email||"";
  Object.entries(R).forEach(([k,v])=>{const h=jh(v);if(all||SBH[k]!==h)up.push({k,v:v===undefined?null:v,updated_by:who})});
  Object.keys(SBH).forEach(k=>{if(R[k]===undefined&&SBH[k]!==jh(null))up.push({k,v:null,updated_by:who})});
  if(!up.length)return;
  try{for(let i=0;i<up.length;i+=200){const {error}=await SB.from("haqiba_rows").upsert(up.slice(i,i+200));if(error)throw error}
    up.forEach(r=>SBH[r.k]=jh(r.v));localStorage.setItem("haqiba-sbh",JSON.stringify(SBH));SBST="ok";SBERR="";
    await sbPublishSurveys();
  }catch(e){SBST="err";SBERR=e.message||String(e)}sbBadge();
}
function sbQueue(){if(!sbOn())return;clearTimeout(SBT);SBST="sync";sbBadge();SBT=setTimeout(()=>sbPush(false),1200)}
async function sbPublishSurveys(){ // only what a student needs to open the link
  const pub=DB.surveys.filter(s=>s.aud!=="fac").map(s=>({id:s.id,v:{title:s.title,items:s.items,open:s.open,course:s.course?CAT[s.course]?.name:"",prog:S().program,inst:S().inst}}));
  if(pub.length)try{await SB.from("haqiba_public").upsert(pub)}catch(e){}
}
async function sbPullResponses(){
  try{const {data,error}=await SB.from("haqiba_responses").select("id,sid,a,at").order("created_at",{ascending:true}).limit(10000);if(error)return;
    let ch=false;const ts=S().termStart;data.filter(r=>!ts||!r.at||r.at>=ts).forEach(r=>{const L=respOf(r.sid);if(!L.some(x=>x.rid===r.id)){L.push({rid:r.id,at:r.at,a:r.a});ch=true}});if(ch)save();
  }catch(e){}
}
async function sbInit(){
  const c=sbCfg();if(!c.url||!c.key){SBST="off";return}
  try{await loadLib("supabase");SB=supabase.createClient(c.url,c.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:"implicit"}});
    const {data}=await SB.auth.getSession();SBUSER=data.session?.user||null;SBST=SBUSER?"sync":"login";
    SB.auth.onAuthStateChange((ev,s)=>{const was=!!SBUSER;SBUSER=s?.user||null;if(SBUSER&&!was){sbPull(SBFIRST);SBFIRST=false}if(!SBUSER)SBST="login";render()});
    if(SBUSER){await sbPull(!SBLAST);SBFIRST=false}
    setInterval(()=>{if(sbOn()&&!document.hidden)sbPull(false)},25000);
    addEventListener("focus",()=>{if(sbOn())sbPull(false)});
    render();
  }catch(e){SBST="err";SBERR=e.message||String(e);sbBadge()}
}
function sbBadge(){const el=$("#sbst");if(!el)return;const M={off:["","وضع محلي على هذا الجهاز"],login:["p-wait","سجّلي الدخول للمزامنة"],sync:["p-info","جارٍ المزامنة…"],ok:["p-ok","متزامن مع قاعدة البيانات"],err:["p-bad","تعذرت المزامنة"]}[SBST]||["",""];el.className="pill "+M[0];el.textContent=M[1];el.title=SBERR||"";el.hidden=SBST==="off"}
/* files: keep a copy in Supabase Storage */
const fpath=k=>"f/"+hash(k).toString(36)+"-"+hash([...k].reverse().join("")).toString(36);
{const _put=FS.put,_get=FS.get,_del=FS.del;
 FS.put=async(k,b)=>{await _put(k,b);if(sbOn())try{await SB.storage.from("haqiba-files").upload(fpath(k),b,{upsert:true,contentType:b.type||"application/octet-stream"})}catch(e){}};
 FS.get=async k=>{let v=await _get(k);if(!v&&sbOn())try{const {data}=await SB.storage.from("haqiba-files").download(fpath(k));if(data){v=data;await _put(k,data)}}catch(e){}return v};
 FS.del=async k=>{await _del(k);if(sbOn())try{await SB.storage.from("haqiba-files").remove([fpath(k)])}catch(e){}};}

/* ================= any department, any university: program setup from its own documents =================
   - DB.mode "live": no sample students/surveys; everything comes from what the department enters or uploads.
   - DB.prog: the study plan, program learning outcomes, the outcomes matrix and KPI targets
     (read from the department's own TP-151 Word file, or an Excel study plan).
   - Course specifications: the official TP-153 form, filled in the app or read from the department's TP-153 Word file,
     and exported as Word on the official template. */
const isLive=()=>DB.mode==="live";
const AR_D=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const CODE_RE=/^[A-Z]{2,5}\s?\d{3,4}[A-Z]?$/;
const normCode=s=>AR_D(s).toUpperCase().replace(/\s+/g,"");
const domOf=c=>{const x=String(c||"").trim()[0];return /[عK]/i.test(x)?"k":/[مS]/i.test(x)?"s":/[قV]/i.test(x)?"v":null};
const PLO_RE=/^[عمقKSVksv]\s?\d{1,2}$/;
function lvlOf(v){v=AR_D(v).trim();if(!v)return 0;if(/^[1Iت]/i.test(v))return 1;if(/^[2Pم]/i.test(v))return 2;if(/^[3MAع]/i.test(v))return 3;return 0}
const reqNorm=r=>/جامع/.test(r)?"جامعة":/كلي/.test(r)?"كلية":/مسار/.test(r)?"مسار":"تخصص";

/* --- apply the department's program to the app's catalog (in place, so every view follows) --- */
function applyProg(){
  try{document.body.classList.toggle("live",isLive())}catch(e){}
  const P=DB.prog;if(!P||!P.courses||!P.courses.length)return;
  PLOS.splice(0,PLOS.length,...P.plos.map(p=>({c:p.c,d:p.d,t:p.t})));
  const keep=DB.matrix&&DB.matrix.length===P.courses.length&&DB.matrix.every(m=>m.length===PLOS.length);
  MATRIX.splice(0,MATRIX.length,...P.courses.map((c,i)=>({code:c.code,name:c.name,level:c.level,m:keep?DB.matrix[i]:PLOS.map(p=>(P.mx[c.code]||{})[p.c]||0)})));
  CATALOG.splice(0,CATALOG.length,...MATRIX.map(r=>({id:r.code,code:r.code,name:r.name,level:r.level,m:r.m})));
  Object.keys(CAT).forEach(k=>delete CAT[k]);
  CATALOG.forEach(c=>{const x=P.courses.find(y=>y.code===c.code)||{};Object.assign(c,{req:x.req||"تخصص",cr:x.cr||"",en:x.en||"",pre:x.pre||"لا يوجد",opt:!!x.opt});CAT[c.id]=c});

    ys.forEach(y=>{const r=pg.filter(i=>Math.abs(i.y-y)<1.5).sort((a,b)=>b.x-a.x),S_=r.map(i=>i.s);
      const pr=S_.findIndex(s=>/^البرنامج\s*:?$/.test(s));if(pr>=0&&S_[pr+1]&&!info.program)info.program=S_[pr+1].split(/\s+-\s+/)[0].trim();
      const lc=S_.find(s=>/^\d?[A-Z]{2,}\d{4,}$/.test(s)&&!/^[A-Z]{2,5}\d{4}$/.test(s));
      if(lc&&r.some(i=>/المستو[ىي]/.test(i.s))){lv=+lc.slice(-2)||lv+1;opt=false;return}
      if(S_.some(s=>/^القاعدة/.test(s))){opt=true;return}

      courses.push({code,name:AR_D(name),level:lv||1,opt,pre:"لا يوجد",cr:nums.length?+nums[0].s:"",req:/^(ISLM|ARAB|HIST|AI)/.test(code)?"جامعة":"تخصص"})})});
  return {courses,plos:[],mx:{},kpiT:{},info};
}
